[project]
name = "temparse"
version = "1.0.0"
description = "temparse is template + parse"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[[project.authors]]
name = "jiang-zhexin"
email = "162887873+jiang-zhexin@users.noreply.github.com"

[project.urls]
homepage = "https://github.com/jiang-zhexin/temparse"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.15.22",
  "ty>=0.0.61",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"
